syntax = "proto3";

package pb;

option go_package = "github.com/Jingqi0327/eleclog/pb";

message QueryRoomSurplusRequest {
    string area_id = 1;
    string building_code = 2;
    string floor_code = 3;
    string room_code = 4;
}

message QueryRoomSurplusResponse {
    string json_data = 1; // 原始的 JSON 字符串
}
