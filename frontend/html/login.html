<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 — ElecLog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(ellipse at 30% 20%, rgba(79,156,249,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 80%, rgba(99,102,241,0.06) 0%, transparent 50%);
    }
    .card {
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      padding: 2.5rem 2rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
      justify-content: center;
    }
    .logo-text { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.3px; }
    .logo-sub { color: var(--text-muted); font-size: 0.75rem; margin-top: 0.1rem; }
    h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.5rem; color: var(--text-muted); text-align: center; }
    .field { margin-bottom: 1.1rem; }
    .btn {
      width: 100%;
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }
    .btn:active { transform: scale(0.98); }
    .error {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px;
      color: var(--red);
      padding: 0.6rem 0.8rem;
      font-size: 0.82rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13 3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <div>
        <div class="logo-text">ElecLog</div>
        <div class="logo-sub">寝室电费监控系统</div>
      </div>
    </div>
    <h2>账号登录</h2>
    <div class="error" id="errMsg"></div>
    <div class="field">
      <label for="username">用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" />
    </div>
    <button class="btn primary" id="loginBtn">登 录</button>
  </div>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
