<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>所有房间 — ElecLog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="css/global.css" />
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13 3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <span class="logo-name">ElecLog</span>
    </a>
    <nav class="nav-btns"></nav>
  </header>

  <main>
    <h1>所有房间</h1>

    <!-- 房间列表 + 操作 -->
    <div class="card" style="margin-bottom: 2rem;">
      <div class="card-header">
        <h2>所有房间</h2>
        <button class="btn ghost" onclick="refreshRooms(1, true)" title="刷新列表">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        </button>
      </div>
      <table id="roomTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>名称</th>
            <th style="text-align: left;">操作</th>
          </tr>
        </thead>
        <tbody id="roomTableBody">
          <tr><td colspan="3" class="empty-row">加载中…</td></tr>
        </tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>

    <!-- 添加新房间 -->
    <div class="card">
      <div class="card-header"><h2>添加新房间</h2></div>
      <div class="form-grid">
        <div class="field">
          <label>校区</label>
          <select id="selArea" onchange="onAreaChange()">
            <option value="">请选择校区</option>
          </select>
        </div>
        <div class="field">
          <label>楼栋</label>
          <select id="selBuilding" disabled onchange="onBuildingChange()">
            <option value="">请先选择校区</option>
          </select>
        </div>
        <div class="field">
          <label>楼层</label>
          <select id="selFloor" disabled onchange="onFloorChange()">
            <option value="">请先选择楼栋</option>
          </select>
        </div>
        <div class="field">
          <label>房间</label>
          <select id="selRoom" disabled onchange="onRoomChange()">
            <option value="">请先选择楼层</option>
          </select>
        </div>
        <div class="field" style="display:flex;align-items:flex-end">
          <button class="btn primary" id="addRoomBtn" onclick="addRoom()" disabled style="width:100%;justify-content:center">添加房间</button>
        </div>
      </div>
    </div>
  </main>

  <!-- 导入数据弹窗 -->
  <div class="modal-overlay" id="importModal">
    <div class="modal">
      <h3>导入历史数据</h3>
      <div style="color:var(--text-muted);font-size:0.83rem;margin-bottom:0.9rem">
        选择历史抓取的 JSON 文件（格式：<code>[{"timestamp":"...","surplus":...}]</code>）<br/>
        系统会自动跳过已存在的数据，支持重复导入。
      </div>
      <div class="field">
        <label>房间</label>
        <div id="importRoomName" style="padding: 0.4rem 0; font-weight:600; color:var(--accent)"></div>
      </div>
      <div class="field">
        <label>JSON 文件</label>
        <div style="position:relative; width:100%;">
          <input type="file" id="importFile" accept=".json" style="position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0;" onchange="document.getElementById('fileNameText').textContent = this.files[0] ? this.files[0].name : '未选择文件'" />
          <label for="importFile" style="display:flex; justify-content:space-between; align-items:center; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:0.5rem 0.8rem; color:var(--text); cursor:pointer; font-size:0.85rem; transition:border-color 0.2s;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
            <span id="fileNameText" style="color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:0.5rem;">未选择文件</span>
            <span style="background:var(--accent); color:#fff; padding:0.35rem 0.8rem; border-radius:8px; font-weight:500; flex-shrink:0;">选择文件</span>
          </label>
        </div>
      </div>
      <div id="importResult" style="display:none; margin-top:0.5rem; padding:0.6rem 0.8rem; border-radius:8px; font-size:0.83rem;"></div>
      <div class="modal-footer">
        <button class="btn" onclick="closeImportModal()">关闭</button>
        <button class="btn primary" id="importBtn" onclick="doImport()">开始导入</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/pages/all_rooms.js?v=1779613562"></script>
</body>
</html>
