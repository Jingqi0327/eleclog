<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElecLog — 寝室电费总览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    body {
      background-image: radial-gradient(ellipse at 20% 10%, rgba(79,156,249,0.07) 0%, transparent 55%);
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .room-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.4rem;
      cursor: pointer;
      transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
      text-decoration: none;
      display: block;
    }
    .room-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 30px rgba(79,156,249,0.15);
    }
    .room-id { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 0.3rem; }
    .room-name { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.8rem; color: #fff; }
    .room-balance {
      font-size: 1.6rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .room-balance.good { color: var(--green); }
    .room-balance.warn { color: var(--yellow); }
    .room-balance.low  { color: var(--red); }
    .room-balance-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }
    .room-time { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.6rem; }
    
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .skeleton-card {
      height: 140px; border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13 3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <span class="logo-name">ElecLog</span>
    </a>
    <nav class="nav-btns"></nav>
  </header>

  <main>
    <h1>寝室电费总览</h1>
    <p class="subtitle">实时监控各寝室用电余额，点击房间查看详细用电趋势</p>
    <div class="grid" id="grid">
      <!-- skeleton -->
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
    <div class="pagination" id="pagination"></div>
  </main>

  <script type="module" src="js/pages/overview.js"></script>
</body>
</html>
