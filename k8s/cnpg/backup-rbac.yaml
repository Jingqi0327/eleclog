apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-secret-reader
  namespace: default
rules:
  # 允许读取对应凭证的 Secret
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cnpg-backup-credentials"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-secret-reader-binding
  namespace: default
subjects:
  # 绑定给 CNPG 生成的默认数据库 ServiceAccount
  - kind: ServiceAccount
    name: eleclog-pg
    namespace: default
roleRef:
  kind: Role
  name: cnpg-secret-reader
  apiGroup: rbac.authorization.k8s.io
