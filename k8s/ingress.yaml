# 1. 定义 Traefik 的 Middleware，用于剥离 /api 前缀
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
spec:
  stripPrefix:
    prefixes:
      - /api

---
# 2. 定义统一的 Ingress (同时接管前端和后端流量，并配置 HTTPS)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eleclog-ingress
  annotations:
    # 挂载剥离前缀的中间件
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-api-prefix@kubernetescrd
    # 告诉 cert-manager 使用我们刚定义的 ClusterIssuer 来申请证书
    cert-manager.io/cluster-issuer: "letsencrypt"
spec:
  ingressClassName: traefik # 【正确】指定使用 Traefik，这是现在的标准做法
  tls:
  - hosts:
    - "elec.weiliang-rumeng.top"
    secretName: eleclog-tls-cert # cert-manager 申请成功后，证书会自动存入这个 Secret 里
  rules:
  - host: "elec.weiliang-rumeng.top"
    http:
      paths:
      - pathType: Prefix
        path: "/api"
        backend:
          service:
            name: eleclog-api-service
            port:
              number: 6060
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: eleclog-frontend-service
            port:
              number: 80